spring.application.name=hospital-management
server.port=8080

# SQLite File Connection (Generates hospital.db in project root)
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:hospital.db

# Dialect & Schema Auto-Update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Connection Pool Config (Prevents file write lock contention)
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=SQLiteHikariCP